# ============================================================================
# Pavitram JobPortal — production compose
#
# SIMPLE SETUP: Postgres (and MinIO) already run in Docker for other
# projects on this VPS, and are already published on host ports (see
# `docker ps` — e.g. Postgres on 32768, MinIO on 9000-9001). So instead of
# joining their internal docker network, we just reach them through the host
# itself via `host.docker.internal` (mapped below via extra_hosts). We do
# NOT create a new database — we reuse the existing one, and only add new
# tables to it, all prefixed `jobportal_` (see backend/src/database/entities)
# so nothing can collide with any other project's tables.
# ============================================================================

services:
  jobportal-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pavitram-jobportal-backend:latest
    container_name: pavitram-jobportal-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGINS: "${FRONTEND_PUBLIC_URL},${BACKEND_PUBLIC_URL}"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CENTRAL_AUTH_BASE_URL: ${CENTRAL_AUTH_BASE_URL:-https://mainbackend.pavitramindia.com/api/v1}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    # Bound to localhost only — Nginx (already on the VPS) reverse-proxies
    # the public subdomain to this port. Not directly reachable from the
    # internet, so it can't clash with any other project's public ports.
    ports:
      - "127.0.0.1:${BACKEND_PORT}:4000"

  jobportal-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same origin. The browser calls https://<frontend>/api/v1/... and the Next.js server
        # forwards it to the backend container, so the separate API domain is no longer required.
        NEXT_PUBLIC_API_BASE_URL: ""
    image: pavitram-jobportal-frontend:latest
    container_name: pavitram-jobportal-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      # Private address of the backend container. Read at RUNTIME by the /api/* proxy and the /status page.
      BACKEND_INTERNAL_URL: "http://jobportal-backend:4000"
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    depends_on:
      - jobportal-backend

networks:
  default:
    name: pavitram-jobportal-net
