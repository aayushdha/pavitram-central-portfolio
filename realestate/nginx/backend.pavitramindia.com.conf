# /etc/nginx/sites-available/backend.pavitramindia.com
#
# Copy this file to /etc/nginx/sites-available/, then:
#   sudo ln -s /etc/nginx/sites-available/backend.pavitramindia.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d backend.pavitramindia.com
# certbot will automatically rewrite this file to add the SSL server block —
# you don't need to write the HTTPS part by hand.

server {
    listen 80;
    listen [::]:80;
    server_name backend.pavitramindia.com;

    # NestJS with a global prefix of /api/v1 — see backend/src/main.ts
    location / {
        proxy_pass http://127.0.0.1:4010;   # must match BACKEND_PORT in .env
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 15m;
    }
}
