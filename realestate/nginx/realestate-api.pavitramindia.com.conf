# /etc/nginx/sites-available/realestate-api.pavitramindia.com
#
# Copy this file to /etc/nginx/sites-available/, then:
#   sudo ln -s /etc/nginx/sites-available/realestate-api.pavitramindia.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d realestate-api.pavitramindia.com
# certbot will automatically rewrite this file to add the SSL server block.

server {
    listen 80;
    listen [::]:80;
    server_name realestate-api.pavitramindia.com;

    # NestJS with a global prefix of /api/v1 — see backend/src/main.ts
    location / {
        proxy_pass http://127.0.0.1:4010;   # must match BACKEND_PORT in .env
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 15m;  # a little headroom above MAX_UPLOAD_MB
    }
}
