# ============================================================================
# Pavitram Real Estate — production compose
#
# SIMPLE SETUP: Postgres (and MinIO) already run in Docker for another
# project on this VPS, and are already published on host ports (see
# `docker ps` — e.g. Postgres on 32768, MinIO on 9000-9001). So instead of
# joining their internal docker network, we just reach them through the host
# itself via `host.docker.internal` (mapped below via extra_hosts). We do
# NOT create a new database — we reuse the existing one, and only add new
# tables to it, all prefixed `realnew_` (see backend/prisma/schema.prisma)
# so nothing can collide with the other project's tables.
# ============================================================================

services:
  realestate-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pavitram-realestate-backend:latest
    container_name: pavitram-realestate-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGINS: "${FRONTEND_PUBLIC_URL},${BACKEND_PUBLIC_URL}"
      CENTRAL_AUTH_BASE_URL: ${CENTRAL_AUTH_BASE_URL:-https://mainbackend.pavitramindia.com/api/v1}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    # Bound to localhost only — Nginx (already on the VPS) reverse-proxies
    # the public subdomain to this port. Not directly reachable from the
    # internet, so it can't clash with the other project's public ports.
    ports:
      - "127.0.0.1:${BACKEND_PORT}:4000"

  realestate-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # IMPORTANT: this backend's global route prefix is `api/v1` (see
        # `backend/src/main.ts` — `app.setGlobalPrefix('api/v1')`), so every
        # actual endpoint lives at e.g. `/api/v1/auth/signup`, not `/auth/signup`.
        # BACKEND_PUBLIC_URL itself is deliberately the bare origin (no path) —
        # it's also reused for CORS_ORIGINS above, where a path suffix would
        # be wrong — so the `/api/v1` is appended here specifically.
        NEXT_PUBLIC_API_BASE_URL: ${BACKEND_PUBLIC_URL}/api/v1
    image: pavitram-realestate-frontend:latest
    container_name: pavitram-realestate-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${BACKEND_PUBLIC_URL}/api/v1
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    depends_on:
      - realestate-backend

networks:
  default:
    name: pavitram-realestate-net